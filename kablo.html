function calc() {
  const val = parseFloat(document.getElementById('target').value.replace(',', '.'));
  if (isNaN(val)) { document.getElementById('output').style.display = 'none'; return; }
  let closest = "0.5";
  let minDiff = 9999;
  for (let k in data) {
    let diff = Math.abs(parseFloat(k) - val);
    if (diff < minDiff) { minDiff = diff; closest = k; }
  }
  const out = document.getElementById('output');
  out.style.display = 'block';
  let html = `<div class="weight">Efektif ${closest.replace('.', ',')} kg için tek tarafa tak:</div>`;

  out.innerHTML = html;
